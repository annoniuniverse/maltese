<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Taller Maltese</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col antialiased overflow-x-hidden">

    <!-- FONDO DECORATIVO SUTIL -->
    <div class="fixed inset-0 pointer-events-none opacity-30">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('img/headermaltese.png');"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-[#0a0a0a]/70 via-[#0a0a0a]/90 to-[#0a0a0a]"></div>
    </div>

    <!-- HEADER MINIMAL -->
    <header class="relative z-10 p-6 flex justify-start items-center">
        <a href="index.html" class="cursor-pointer">
            <img src="img/malteselogo.png" alt="Maltese Logo" class="h-10 md:h-12 w-auto object-contain">
        </a>
    </header>

    <!-- CONTENIDO CENTRADO -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md bg-[#111111] border border-zinc-800 rounded-lg shadow-2xl p-8 md:p-10">

            <!-- Encabezado -->
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-light tracking-widest uppercase text-white mb-2">Acceder</h1>
                <p class="text-zinc-500 text-sm font-light">Ingresá para ver el historial de tu vehículo</p>
            </div>

            <!-- Botón Google -->
            <button id="btn-google" class="group flex items-center justify-center w-full bg-white text-zinc-900 font-medium py-3 px-4 rounded-sm hover:bg-zinc-100 transition-colors shadow-sm">
                <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar con Google
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <div class="h-px bg-zinc-800 flex-grow"></div>
                <span class="text-[10px] tracking-widest uppercase text-zinc-600">Solo clientes registrados</span>
                <div class="h-px bg-zinc-800 flex-grow"></div>
            </div>

            <p class="text-center text-xs text-zinc-500 font-light leading-relaxed">
                Si todavía no tenés acceso, pedile al taller que registre tu vehículo con tu mail.
            </p>

            <!-- Volver -->
            <div class="mt-8 text-center">
                <a href="index.html" class="text-xs text-zinc-500 hover:text-white transition-colors tracking-widest uppercase underline-offset-4 hover:underline">
                    &larr; Volver al inicio
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER MINIMAL -->
    <footer class="relative z-10 py-6 text-center">
        <p class="text-[10px] text-zinc-700 tracking-widest uppercase">&copy; 2024 Taller Maltese</p>
    </footer>

    <!-- Script para manejar el login -->
    <script type="module">
        import { loginConGoogle } from './js/auth.js';

        document.getElementById('btn-google').addEventListener('click', () => {
            loginConGoogle();
        });
    </script>

</body>
</html>
