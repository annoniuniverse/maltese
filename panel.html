<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Taller Maltese</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-700 tracking-tight cursor-pointer" onclick="window.location.reload()">Maltese</div>
            <div class="flex items-center space-x-4">
                <span id="user-email" class="text-sm text-gray-500 hidden md:block"></span>
                <button id="btn-logout" class="text-sm text-red-500 hover:text-red-700 font-medium">Salir</button>
            </div>
        </div>
    </nav>

    <!-- LOADER -->
    <div id="loader" class="flex-grow flex items-center justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <!-- CONTENIDO -->
    <main id="contenido" class="hidden flex-grow max-w-6xl mx-auto px-4 py-10 w-full">
        
        <!-- ========================================== -->
        <!-- VISTA ADMIN (LISTA) -->
        <!-- ========================================== -->
        <div id="vista-admin" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Panel de Administración</h1>
                <button id="btn-nuevo-servicio" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition font-medium shadow-sm">
                    + Cargar Servicio Nuevo
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-100">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-xl font-semibold text-gray-800">Autos Registrados</h2>
                            <p class="text-sm text-gray-500 mt-1">Hacé clic en un auto para ver su historial y editar.</p>
                        </div>
                        <div class="w-full md:w-72">
                            <input type="text" id="input-buscador" placeholder="Buscar por patente, cliente, modelo..." class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>
                <div id="lista-autos-admin" class="divide-y divide-gray-100">
                    <!-- Se llena con JS -->
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA DETALLE ADMIN (AL HACER CLIC) -->
        <!-- ========================================== -->
        <div id="vista-detalle-admin" class="hidden">
            <button id="btn-volver-lista" class="text-blue-600 hover:text-blue-800 font-medium mb-6 flex items-center gap-2">
                &larr; Volver a la lista
            </button>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-gray-800 text-white p-6 flex justify-between items-start">
                    <div>
                        <h2 id="detalle-titulo" class="text-2xl font-bold"></h2>
                        <p id="detalle-patente" class="text-gray-300 text-sm mt-1"></p>
                        <p id="detalle-cliente" class="text-gray-400 text-sm mt-1"></p>
                    </div>
                    <div class="flex space-x-2">
                        <button id="btn-editar-auto" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition text-sm font-medium shadow-sm">
                            Editar Auto
                        </button>
                        <button id="btn-agregar-a-este-auto" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium shadow-sm">
                            + Agregar Servicio
                        </button>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-semibold text-gray-700 mb-4 border-b pb-2">Historial de Servicios</h3>
                    <div id="detalle-historial" class="space-y-4">
                        <!-- Se llena con JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA CLIENTE -->
        <!-- ========================================== -->
        <div id="vista-cliente" class="hidden">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Mi Vehículo</h1>
            <div id="lista-autos-cliente" class="space-y-6">
                <!-- Se llena con JS -->
            </div>
        </div>

    </main>

    <!-- MODAL PARA CARGAR SERVICIO -->
    <div id="modal-servicio" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10">
                <h2 id="modal-titulo-servicio" class="text-xl font-bold text-gray-800">Cargar Servicio</h2>
                <button id="btn-cerrar-modal" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            
            <form id="form-servicio" class="p-6 space-y-4">
                <div id="seccion-datos-auto" class="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">
                    <h3 class="font-semibold text-gray-700 mb-3">Datos del Vehículo</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Patente</label>
                            <input type="text" id="input-patente" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email del Cliente</label>
                            <input type="email" id="input-email" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Cliente</label>
                            <input type="text" id="input-nombre" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                            <input type="text" id="input-marca" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
                            <input type="text" id="input-modelo" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
                            <input type="number" id="input-anio" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="font-semibold text-blue-800 mb-3">Detalle del Servicio</h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                                <input type="date" id="input-fecha" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kilómetros</label>
                                <input type="number" id="input-km" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Servicio Realizado</label>
                            <textarea id="input-servicio" required rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fotos (Opcional)</label>
                            <input type="file" id="input-fotos" multiple accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" id="btn-guardar-servicio" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition font-medium shadow-sm">
                        Guardar Servicio
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PARA EDITAR AUTO -->
    <div id="modal-editar-auto" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">Editar Datos del Vehículo</h2>
                <button id="btn-cerrar-modal-editar" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            
            <form id="form-editar-auto" class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Patente</label>
                        <input type="text" id="edit-patente" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email del Cliente</label>
                        <input type="email" id="edit-email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Cliente</label>
                        <input type="text" id="edit-nombre" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                        <input type="text" id="edit-marca" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
                        <input type="text" id="edit-modelo" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
                        <input type="number" id="edit-anio" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" id="btn-guardar-edicion" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition font-medium shadow-sm">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { supabase } from './js/supabase-client.js';
        import { esAdmin, cerrarSesion, obtenerUsuario } from './js/auth.js';
        import { subirFoto, buscarAuto, crearAuto, crearServicio, obtenerTodosLosAutos, obtenerServiciosAuto, actualizarAuto } from './js/admin.js';
        import { obtenerMisAutos, obtenerHistorial } from './js/cliente.js';

        // Elementos DOM
        const loader = document.getElementById('loader');
        const contenido = document.getElementById('contenido');
        const vistaAdmin = document.getElementById('vista-admin');
        const vistaDetalleAdmin = document.getElementById('vista-detalle-admin');
        const vistaCliente = document.getElementById('vista-cliente');
        const userEmailSpan = document.getElementById('user-email');
        const btnLogout = document.getElementById('btn-logout');
        
        // Modales
        const modalServicio = document.getElementById('modal-servicio');
        const modalEditarAuto = document.getElementById('modal-editar-auto');
        
        let autoSeleccionado = null;
        let listaAutosGlobal = [];

        // 1. Inicialización
        async function init() {
            const user = await obtenerUsuario();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            userEmailSpan.textContent = user.email;
            loader.classList.add('hidden');
            contenido.classList.remove('hidden');

            const admin = await esAdmin();

            if (admin) {
                vistaAdmin.classList.remove('hidden');
                cargarVistaAdmin();
            } else {
                vistaCliente.classList.remove('hidden');
                cargarVistaCliente(user.email);
            }
        }

        btnLogout.addEventListener('click', cerrarSesion);

        // 2. Lógica ADMIN - Lista con Buscador
        async function cargarVistaAdmin() {
            const autos = await obtenerTodosLosAutos();
            listaAutosGlobal = autos; 
            
            // Evento del buscador
            document.getElementById('input-buscador').addEventListener('input', (e) => {
                const texto = e.target.value.toLowerCase();
                const filtrados = listaAutosGlobal.filter(auto => 
                    auto.patente.toLowerCase().includes(texto) ||
                    auto.nombre_cliente.toLowerCase().includes(texto) ||
                    auto.email_cliente.toLowerCase().includes(texto) ||
                    auto.marca.toLowerCase().includes(texto) ||
                    auto.modelo.toLowerCase().includes(texto)
                );
                renderizarListaAdmin(filtrados);
            });

            renderizarListaAdmin(autos);
        }

        function renderizarListaAdmin(autos) {
            const lista = document.getElementById('lista-autos-admin');
            lista.innerHTML = '';

            if (autos.length === 0) {
                lista.innerHTML = '<div class="p-6 text-gray-500 text-center">No se encontraron autos con ese criterio.</div>';
                return;
            }

            autos.forEach(auto => {
                const div = document.createElement('div');
                div.className = 'p-6 hover:bg-blue-50 transition cursor-pointer flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-4 border-transparent hover:border-blue-600';
                
                const cantServicios = auto.maltese_servicios ? auto.maltese_servicios.length : 0;

                div.innerHTML = `
                    <div>
                        <h3 class="font-bold text-lg text-gray-800">${auto.marca} ${auto.modelo} (${auto.anio})</h3>
                        <p class="text-gray-600 text-sm">Patente: <span class="font-medium bg-gray-200 px-2 py-1 rounded">${auto.patente}</span></p>
                        <p class="text-gray-500 text-sm mt-1">Cliente: ${auto.nombre_cliente} (${auto.email_cliente})</p>
                        <p class="text-blue-600 text-sm font-medium mt-1">${cantServicios} servicio(s) registrado(s)</p>
                    </div>
                    <div class="text-blue-500 font-medium text-sm">Ver detalle &rarr;</div>
                `;
                
                div.addEventListener('click', () => abrirDetalleAdmin(auto));
                lista.appendChild(div);
            });
        }

        // 3. Lógica ADMIN - Detalle
        async function abrirDetalleAdmin(auto) {
            vistaAdmin.classList.add('hidden');
            vistaDetalleAdmin.classList.remove('hidden');
            autoSeleccionado = auto;

            document.getElementById('detalle-titulo').textContent = `${auto.marca} ${auto.modelo} (${auto.anio})`;
            document.getElementById('detalle-patente').textContent = `Patente: ${auto.patente}`;
            document.getElementById('detalle-cliente').textContent = `Cliente: ${auto.nombre_cliente} (${auto.email_cliente})`;

            const historial = await obtenerServiciosAuto(auto.id);
            const contenedor = document.getElementById('detalle-historial');
            contenedor.innerHTML = '';

            if (historial.length === 0) {
                contenedor.innerHTML = '<p class="text-gray-500 text-sm italic">No hay servicios registrados para este auto.</p>';
                return;
            }

            historial.forEach(serv => {
                let fotosHtml = '';
                if (serv.fotos && serv.fotos.length > 0) {
                    fotosHtml = '<div class="flex gap-2 mt-3 overflow-x-auto pb-2">' + 
                        serv.fotos.map(url => `<img src="${url}" class="h-24 w-24 object-cover rounded-lg border border-gray-200 cursor-pointer" onclick="window.open('${url}', '_blank')">`).join('') + 
                        '</div>';
                }

                const div = document.createElement('div');
                div.className = 'border-l-4 border-blue-500 pl-4 py-3 bg-gray-50 rounded-r-lg';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-sm font-bold text-blue-700">${new Date(serv.fecha).toLocaleDateString('es-AR')}</span>
                            <span class="text-xs text-gray-500 ml-2">| ${serv.kilometros} km</span>
                        </div>
                    </div>
                    <p class="text-gray-800 text-sm whitespace-pre-wrap">${serv.servicio}</p>
                    ${fotosHtml}
                `;
                contenedor.appendChild(div);
            });
        }

        document.getElementById('btn-volver-lista').addEventListener('click', () => {
            vistaDetalleAdmin.classList.add('hidden');
            vistaAdmin.classList.remove('hidden');
            autoSeleccionado = null;
            // Limpiamos el buscador y recargamos la lista completa
            document.getElementById('input-buscador').value = '';
            cargarVistaAdmin();
        });

        // 4. Lógica CLIENTE
        async function cargarVistaCliente(email) {
            const autos = await obtenerMisAutos();
            const lista = document.getElementById('lista-autos-cliente');
            lista.innerHTML = '';

            if (autos.length === 0) {
                lista.innerHTML = '<div class="bg-white p-8 rounded-2xl shadow-sm text-center text-gray-500">No tenés vehículos registrados a tu nombre todavía.</div>';
                return;
            }

            for (const auto of autos) {
                const servicios = await obtenerHistorial(auto.id);
                
                const div = document.createElement('div');
                div.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden';
                
                let serviciosHtml = '';
                if (servicios.length === 0) {
                    serviciosHtml = '<p class="text-gray-500 text-sm italic">No hay servicios registrados.</p>';
                } else {
                    servicios.forEach(serv => {
                        let fotosHtml = '';
                        if (serv.fotos && serv.fotos.length > 0) {
                            fotosHtml = '<div class="flex gap-2 mt-3 overflow-x-auto pb-2">' + 
                                serv.fotos.map(url => `<img src="${url}" class="h-24 w-24 object-cover rounded-lg border border-gray-200 cursor-pointer" onclick="window.open('${url}', '_blank')">`).join('') + 
                                '</div>';
                        }

                        serviciosHtml += `
                            <div class="border-l-4 border-blue-500 pl-4 py-2 mb-4 bg-gray-50 rounded-r-lg">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <span class="text-sm font-bold text-blue-700">${new Date(serv.fecha).toLocaleDateString('es-AR')}</span>
                                        <span class="text-xs text-gray-500 ml-2">| ${serv.kilometros} km</span>
                                    </div>
                                </div>
                                <p class="text-gray-800 text-sm whitespace-pre-wrap">${serv.servicio}</p>
                                ${fotosHtml}
                            </div>
                        `;
                    });
                }

                div.innerHTML = `
                    <div class="bg-gray-800 text-white p-4">
                        <h3 class="font-bold text-xl">${auto.marca} ${auto.modelo}</h3>
                        <p class="text-gray-300 text-sm">Patente: ${auto.patente} | Año: ${auto.anio}</p>
                    </div>
                    <div class="p-6">
                        <h4 class="font-semibold text-gray-700 mb-4 border-b pb-2">Historial de Servicios</h4>
                        <div class="space-y-2">
                            ${serviciosHtml}
                        </div>
                    </div>
                `;
                lista.appendChild(div);
            }
        }

        // 5. Modal Servicio
        function abrirModalServicio(esNuevoAuto = true, auto = null) {
            modalServicio.classList.remove('hidden');
            modalServicio.classList.add('flex');
            document.getElementById('form-servicio').reset();
            document.getElementById('input-fecha').valueAsDate = new Date();
            document.getElementById('modal-titulo-servicio').textContent = esNuevoAuto ? "Cargar Servicio Nuevo" : "Agregar Servicio a este Auto";

            const inputs = ['input-patente', 'input-email', 'input-nombre', 'input-marca', 'input-modelo', 'input-anio'];
            
            if (esNuevoAuto) {
                document.getElementById('seccion-datos-auto').classList.remove('hidden');
                inputs.forEach(id => document.getElementById(id).required = true);
            } else if (auto) {
                document.getElementById('seccion-datos-auto').classList.add('hidden');
                inputs.forEach(id => document.getElementById(id).required = false);
            }
        }

        document.getElementById('btn-nuevo-servicio').addEventListener('click', () => abrirModalServicio(true));
        document.getElementById('btn-agregar-a-este-auto').addEventListener('click', () => abrirModalServicio(false, autoSeleccionado));
        
        document.getElementById('btn-cerrar-modal').addEventListener('click', () => {
            modalServicio.classList.add('hidden');
            modalServicio.classList.remove('flex');
        });

        // 6. Guardar Servicio
        document.getElementById('form-servicio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnGuardar = document.getElementById('btn-guardar-servicio');
            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Guardando...';

            try {
                let autoId = autoSeleccionado ? autoSeleccionado.id : null;

                if (!autoId) {
                    const autoData = {
                        patente: document.getElementById('input-patente').value.toUpperCase().trim(),
                        email_cliente: document.getElementById('input-email').value.toLowerCase().trim(),
                        nombre_cliente: document.getElementById('input-nombre').value.trim(),
                        marca: document.getElementById('input-marca').value.trim(),
                        modelo: document.getElementById('input-modelo').value.trim(),
                        anio: parseInt(document.getElementById('input-anio').value)
                    };

                    const autoExistente = await buscarAuto(autoData.patente);
                    
                    if (autoExistente) {
                        autoId = autoExistente.id;
                    } else {
                        const nuevoAuto = await crearAuto(autoData);
                        if (!nuevoAuto) throw new Error("No se pudo crear el auto");
                        autoId = nuevoAuto.id;
                    }
                }

                const fileInput = document.getElementById('input-fotos');
                let urlsFotos = [];
                if (fileInput.files.length > 0) {
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const url = await subirFoto(fileInput.files[i]);
                        if (url) urlsFotos.push(url);
                    }
                }

                const servicioData = {
                    auto_id: autoId,
                    fecha: document.getElementById('input-fecha').value,
                    kilometros: parseInt(document.getElementById('input-km').value),
                    servicio: document.getElementById('input-servicio').value.trim(),
                    fotos: urlsFotos
                };

                await crearServicio(servicioData);

                alert('Servicio guardado correctamente');
                modalServicio.classList.add('hidden');
                modalServicio.classList.remove('flex');
                
                if (autoSeleccionado) {
                    abrirDetalleAdmin(autoSeleccionado);
                } else {
                    cargarVistaAdmin();
                }

            } catch (error) {
                console.error(error);
                alert('Error al guardar: ' + error.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar Servicio';
            }
        });

        // 7. Editar Auto
        document.getElementById('btn-editar-auto').addEventListener('click', () => {
            if (!autoSeleccionado) return;
            
            document.getElementById('edit-patente').value = autoSeleccionado.patente;
            document.getElementById('edit-email').value = autoSeleccionado.email_cliente;
            document.getElementById('edit-nombre').value = autoSeleccionado.nombre_cliente;
            document.getElementById('edit-marca').value = autoSeleccionado.marca;
            document.getElementById('edit-modelo').value = autoSeleccionado.modelo;
            document.getElementById('edit-anio').value = autoSeleccionado.anio;

            modalEditarAuto.classList.remove('hidden');
            modalEditarAuto.classList.add('flex');
        });

        document.getElementById('btn-cerrar-modal-editar').addEventListener('click', () => {
            modalEditarAuto.classList.add('hidden');
            modalEditarAuto.classList.remove('flex');
        });

        // Guardar Edición del Auto
        document.getElementById('form-editar-auto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnGuardarEdicion = document.getElementById('btn-guardar-edicion');
            btnGuardarEdicion.disabled = true;
            btnGuardarEdicion.textContent = 'Guardando...';

            try {
                const datosNuevos = {
                    patente: document.getElementById('edit-patente').value.toUpperCase().trim(),
                    email_cliente: document.getElementById('edit-email').value.toLowerCase().trim(),
                    nombre_cliente: document.getElementById('edit-nombre').value.trim(),
                    marca: document.getElementById('edit-marca').value.trim(),
                    modelo: document.getElementById('edit-modelo').value.trim(),
                    anio: parseInt(document.getElementById('edit-anio').value)
                };

                const actualizado = await actualizarAuto(autoSeleccionado.id, datosNuevos);
                
                if (actualizado) {
                    alert('Datos del auto actualizados correctamente');
                    modalEditarAuto.classList.add('hidden');
                    modalEditarAuto.classList.remove('flex');
                    
                    autoSeleccionado = { ...autoSeleccionado, ...datosNuevos };
                    abrirDetalleAdmin(autoSeleccionado);
                } else {
                    throw new Error("No se pudo actualizar el auto");
                }

            } catch (error) {
                console.error(error);
                alert('Error al actualizar: ' + error.message);
            } finally {
                btnGuardarEdicion.disabled = false;
                btnGuardarEdicion.textContent = 'Guardar Cambios';
            }
        });

        init();
    </script>
</body>
</html>
